<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
    <defs>
        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e0f7fa" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#80deea" stop-opacity="0.3" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="20" stdDeviation="15" flood-opacity="0.1"/>
        </filter>
    </defs>

    <!-- Abstract Water Splashes / Background Elements -->
    <path d="M 500,450 C 600,480 750,400 750,250 C 750,100 600,50 450,100 C 300,150 250,300 300,400 C 350,500 400,420 500,450 Z" fill="url(#blueGrad)" opacity="0.6"/>
    <circle cx="650" cy="150" r="40" fill="#00B4D8" opacity="0.2"/>
    <circle cx="200" cy="450" r="80" fill="#00E5FF" opacity="0.1"/>

    <!-- Main Bottle Group -->
    <g filter="url(#shadow)" transform="translate(300, 100)">
        <!-- Bottle Body -->
        <rect x="0" y="0" width="200" height="400" rx="30" fill="#ffffff" stroke="#00B4D8" stroke-width="4"/>
        <path d="M 0,200 Q 100,220 200,200 L 200,370 Q 100,390 0,370 Z" fill="#e6f7ff" opacity="0.8"/>
        <!-- Cap -->
        <rect x="75" y="-30" width="50" height="35" rx="5" fill="#0A2E5C"/>
        <!-- Label -->
        <rect x="0" y="120" width="200" height="100" fill="#0A2E5C"/>
        <text x="100" y="165" font-family="Manrope, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">PURE &amp; FRESH</text>
        <text x="100" y="195" font-family="Poppins, sans-serif" font-size="12" fill="#00B4D8" text-anchor="middle" letter-spacing="2">PREMIUM WATER</text>
    </g>

    <!-- Smaller Bottle (Depth) -->
    <g filter="url(#shadow)" transform="translate(150, 250) scale(0.6)">
        <rect x="0" y="0" width="200" height="400" rx="30" fill="#ffffff" stroke="#00B4D8" stroke-width="4"/>
        <path d="M 0,200 Q 100,220 200,200 L 200,370 Q 100,390 0,370 Z" fill="#e6f7ff" opacity="0.8"/>
        <rect x="75" y="-30" width="50" height="35" rx="5" fill="#0A2E5C"/>
        <rect x="0" y="120" width="200" height="100" fill="#00B4D8"/>
    </g>

    <!-- Medium Bottle (Depth) -->
    <g filter="url(#shadow)" transform="translate(500, 200) scale(0.8)">
        <rect x="0" y="0" width="200" height="400" rx="30" fill="#ffffff" stroke="#0A2E5C" stroke-width="4"/>
        <path d="M 0,200 Q 100,220 200,200 L 200,370 Q 100,390 0,370 Z" fill="#e6f7ff" opacity="0.8"/>
        <rect x="75" y="-30" width="50" height="35" rx="5" fill="#0A2E5C"/>
        <rect x="0" y="120" width="200" height="100" fill="#00B4D8"/>
    </g>

    <!-- Floating Drops -->
    <path d="M 100 150 C 100 166.5 113.5 180 130 180 C 146.5 180 160 166.5 160 150 C 160 130 130 105 130 105 C 130 105 100 130 100 150 Z" fill="#00B4D8" opacity="0.4"/>
    <path d="M 600 500 C 600 516.5 613.5 530 630 530 C 646.5 530 660 516.5 660 500 C 660 480 630 455 630 455 C 630 455 600 480 600 500 Z" fill="#00E5FF" opacity="0.5"/>
</svg>